<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        html,
        body {
            height: 100dvh; /* Full viewport height */
            width: 100vw; /* Full viewport width */
            margin: 0;
            background-color: #333333;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Prevents scrolling */
        }

        .contact-form {
            background-color: #444444;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 90%; /* Use a percentage width for responsiveness */
            max-width: 300px; /* Maintain max width for larger screens */
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #cccccc;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #555555;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #555555;
            color: #ffffff;
        }

        .form-group textarea {
            resize: vertical;
        }

        .form-group button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

        .form-group button:hover {
            background-color: #0056b3;
        }

        .form-group button:active {
            transform: translate(1px, 1px);
        }

        .alert {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #000000;
            color: #F4F1E6;
            padding: 10px 20px;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 1000;
        }

        .alert.show {
            opacity: 1;
        }

        .alert.hide {
            opacity: 0;
        }

        .alert.error {
            background-color: #d9534f;
        }

        .alert.success {
            background-color: #007bff;
        }
    </style>
</head>
<body>
    <div class="contact-form">
        <h2>Contact Us</h2>
        <p>Have questions or need assistance? Fill out the form below to reach out to our team. We're here to help!</p>
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Your Name" required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Your Email" required>
        </div>
        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" rows="4" placeholder="Your Message" required></textarea>
        </div>
        <div class="form-group">
            <button type="submit" onclick="validateForm(event)">Send Message</button>
        </div>
    </div>

    <div id="alert" class="alert">Email sent successfully!</div>

    <script type="text/javascript" src="https://cdn.emailjs.com/sdk/2.3.2/email.min.js"></script>
    <script type="text/javascript">
        (function () {
            emailjs.init("lWzf53QmLTvvzREfQ");
        })();

        function validateForm(event) {
            event.preventDefault();
            var name = document.getElementById('name').value;
            var email = document.getElementById('email').value;
            var message = document.getElementById('message').value;

            if (!name || !email || !message) {
                showAlert('All fields are required.', 'error');
                return;
            }

            if (!validateEmail(email)) {
                showAlert('Please enter a valid email address.', 'error');
                return;
            }

            sendEmail(name, email, message);
        }

        function validateEmail(email) {
            var re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function sendEmail(name, email, message) {
            var templateParams = {
                name: name,
                reply_email: email,
                message: message
            };

            emailjs.send("service_c6tqrmn", "template_yb2grdn", templateParams)
                .then(function (response) {
                    console.log('SUCCESS!', response.status, response.text);
                    showAlert('Email sent successfully!', 'success');
                }, function (error) {
                    console.log('FAILED...', error);
                    showAlert('Failed to send the email. Please try again.', 'error');
                });
        }

        function showAlert(message, type) {
            var alertBox = document.getElementById('alert');
            alertBox.textContent = message;
            alertBox.className = 'alert show ' + type;

            setTimeout(function () {
                alertBox.classList.remove('show');
                alertBox.classList.add('hide');
                setTimeout(function () {
                    alertBox.classList.remove('hide');
                }, 500);
            }, 3000);
        }
    </script>
</body>
</html>
